<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e2a"/>
      <stop offset="100%" stop-color="#14141c"/>
    </linearGradient>
    <linearGradient id="vBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5266eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="vWingLeft" x1="16" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6875f5"/>
      <stop offset="100%" stop-color="#4355d8"/>
    </linearGradient>
    <linearGradient id="vWingRight" x1="32" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#5266eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="vGlow" x1="32" y1="20" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5266eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Container Base with High-Precision Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#vBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#vBorder)" stroke-width="1.5"/>

  <!-- Subtle ambient inner glow -->
  <circle cx="32" cy="32" r="18" fill="url(#vGlow)"/>

  <!-- Left Arm of 'V' (Precision Chamfered Facet) -->
  <path d="M16 18L29.5 45.2C30.6 47.4 33.4 47.4 34.5 45.2L48 18H41.2L32 37.5L22.8 18H16Z" fill="url(#vWingLeft)"/>

  <!-- Right Arm Dynamic Accent Wing (Forward Lift) -->
  <path d="M32 37.5L41.2 18H48L34.5 45.2C33.4 47.4 30.6 47.4 29.5 45.2L28 42.2L34.2 29.8L32 37.5Z" fill="url(#vWingRight)"/>

  <!-- Sourcing & Delivery Diamond / Certainty Node -->
  <polygon points="32,22 36.5,27 32,32 27.5,27" fill="#ffffff" fill-opacity="0.95"/>
  <polygon points="32,22 36.5,27 32,32 27.5,27" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="32" cy="27" r="1.5" fill="#5266eb"/>
</svg>
